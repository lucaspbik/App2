[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stp-bom"
version = "0.1.0"
description = "Generate a bill of materials from STEP (.stp) files"
readme = "README.md"
authors = [{name = "AutoGPT", email = "noreply@example.com"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
stp-bom = "stp_bom.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
